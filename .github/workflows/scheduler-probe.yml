name: Scheduler delivery probe
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record scheduler delivery
        shell: bash
        run: echo "schedule probe event=${{ github.event_name }} run=${{ github.run_id }}"
