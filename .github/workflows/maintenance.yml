name: Scheduled maintenance

# Public-repository trigger for the ZUNO API maintenance endpoint.
#
# Why this lives in a public repository: GitHub's schedule trigger has been
# failing for private repositories since 2026-08-26 (no run object is created
# at all), while scheduled workflows in public repositories keep firing.
# See https://github.com/orgs/community/discussions/206019 and
# https://github.com/orgs/community/discussions/212710
#
# The repository holds no plaintext credentials. API authentication uses only
# GitHub OIDC (audience = API origin, exact repository/ref/workflow_ref), and
# every run mints a short-lived token that the API verifies and burns once.
# The separate backup job receives only encrypted GitHub Actions secrets and
# runs on this trusted runner, never inside the public web container.
#
# Three shots per hour keep maintenance inside OPERATIONS_MAX_STALE_MS
# (2 hours) even when GitHub delivers a slot hours late, and Render Free can
# still spin down between calls. Minutes avoid the top of the hour, where
# GitHub drops or delays schedules under load.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      backup_interval_hours:
        description: "Backup interval override for an authorized manual verification (0 forces a backup)"
        required: false
        default: "24"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: zuno-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Run bounded outbox, purge and scheduler maintenance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Public API origin, without a trailing slash/path. It is also the exact
      # OIDC audience configured as OPERATIONS_OIDC_AUDIENCE on the API.
      ZUNO_API_URL: ${{ vars.ZUNO_API_URL }}
      REQUEST_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check production scheduler configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${ZUNO_API_URL:?Set the ZUNO_API_URL repository variable to the HTTPS API origin}"
          node - <<'NODE'
          const value = process.env.ZUNO_API_URL;
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('ZUNO_API_URL must be an HTTPS origin without credentials, path, query or fragment');
          }
          NODE
      - name: Call authenticated maintenance endpoint with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          request_body="$(jq -nc \
            --arg requestId "$REQUEST_ID" \
            '{tasks:["outbox","purge","schedulers"],batchSize:50,timeBudgetMs:20000,requestId:$requestId}')"
          header_file="$(mktemp "$RUNNER_TEMP/zuno-oidc-header.XXXXXX")"
          trap 'rm -f "$header_file"' EXIT
          response=''
          succeeded=false

          # A fresh OIDC token is requested for every API attempt. The stable
          # requestId still makes retries idempotent, while each new jti avoids
          # colliding with the API's single-use replay protection.
          for attempt in 1 2 3; do
            if ! oidc_response="$(curl --silent --show-error --fail-with-body \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --get --data-urlencode "audience=${ZUNO_API_URL}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}")"; then
              echo "GitHub OIDC token request failed on attempt ${attempt}." >&2
            elif ! oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' <<<"$oidc_response")"; then
              echo "GitHub OIDC response did not contain a token on attempt ${attempt}." >&2
            else
              # curl reads the header from a private file so the bearer token is
              # never printed or exposed in the API command's arguments.
              printf 'Authorization: Bearer %s\n' "$oidc_token" > "$header_file"
              chmod 600 "$header_file"
              if response="$(curl --silent --show-error --fail-with-body \
                --proto '=https' --tlsv1.2 \
                --connect-timeout 15 --max-time 90 \
                --header 'Content-Type: application/json' \
                --header "@${header_file}" \
                --data-binary "$request_body" \
                "${ZUNO_API_URL%/}/api/v1/operations/maintenance")"; then
                succeeded=true
                break
              fi
              echo "Maintenance request failed on attempt ${attempt}." >&2
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          if [ "$succeeded" != true ]; then
            echo 'Maintenance did not succeed after three fresh OIDC attempts.' >&2
            exit 1
          fi
          printf '%s\n' "$response" | jq .
          # The API wraps every successful body in {data: ...} (ResponseInterceptor).
          printf '%s\n' "$response" | jq -e '
            .data.ok == true and
            (.data.budgetExhausted != true) and
            ([.data.schedulerHooks[]? | select(.status == "failed")] | length == 0)
          ' >/dev/null
          if printf '%s\n' "$response" | jq -e 'any(.data.schedulerHooks[]?; .status == "not_configured")' >/dev/null; then
            echo '::warning::Scheduler hooks returned not_configured; outbox/purge ran, but domain schedulers are not wired.'
          fi

  backup:
    name: Run due encrypted offsite backup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
      BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_INTERVAL_HOURS: ${{ inputs.backup_interval_hours || '24' }}
      BACKUP_STATUS_URL: ${{ vars.ZUNO_API_URL }}/api/v1/operations/backup-status
      BACKUP_STATUS_TOKEN: ${{ secrets.BACKUP_STATUS_TOKEN }}
      NODE_ENV: production
    steps:
      - name: Check out trusted backup scripts
        uses: actions/checkout@v5

      - name: Check backup status reporting configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${BACKUP_STATUS_URL:?Set the ZUNO_API_URL repository variable}"
          : "${BACKUP_STATUS_TOKEN:?Set the BACKUP_STATUS_TOKEN Actions secret}"
          node --input-type=module - <<'NODE'
          import { validateStatusUrl } from './scripts/backup-status-reporter.mjs';
          validateStatusUrl(process.env.BACKUP_STATUS_URL, { production: true });
          const token = process.env.BACKUP_STATUS_TOKEN;
          if (typeof token !== 'string' || token.length < 32 || token.length > 512) {
            throw new Error('BACKUP_STATUS_TOKEN must contain 32 to 512 characters.');
          }
          NODE

      - name: Check backup runner tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in node pg_dump psql gpg sha256sum aws jq; do
            command -v "$tool" >/dev/null || { echo "Required backup tool is missing: $tool" >&2; exit 1; }
          done

      - name: Run encrypted backup only when due
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          : "${BACKUP_DATABASE_URL:?Set the BACKUP_DATABASE_URL Actions secret}"
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Set the BACKUP_ENCRYPTION_PASSPHRASE Actions secret}"
          : "${BACKUP_S3_BUCKET:?Set the BACKUP_S3_BUCKET Actions secret}"
          : "${BACKUP_S3_REGION:?Set the BACKUP_S3_REGION Actions secret}"
          : "${BACKUP_S3_ACCESS_KEY_ID:?Set the BACKUP_S3_ACCESS_KEY_ID Actions secret}"
          : "${BACKUP_S3_SECRET_ACCESS_KEY:?Set the BACKUP_S3_SECRET_ACCESS_KEY Actions secret}"

          prefix="${BACKUP_S3_PREFIX:-zuno}"
          prefix="${prefix%/}/"
          [[ "$BACKUP_INTERVAL_HOURS" =~ ^[0-9]+$ ]] || { echo 'BACKUP_INTERVAL_HOURS must be an integer.' >&2; exit 1; }
          [ "$BACKUP_INTERVAL_HOURS" -le 8760 ] || { echo 'BACKUP_INTERVAL_HOURS must not exceed 8760.' >&2; exit 1; }
          interval_seconds=$((BACKUP_INTERVAL_HOURS * 3600))
          due=true
          latest=''
          if latest="$(AWS_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY" \
            AWS_DEFAULT_REGION="$BACKUP_S3_REGION" \
            aws --endpoint-url "$BACKUP_S3_ENDPOINT_URL" --region "$BACKUP_S3_REGION" \
              s3api list-objects-v2 \
              --bucket "$BACKUP_S3_BUCKET" \
              --prefix "$prefix" \
              --output json | jq -r '
                [.Contents[]?
                 | select(.Key | endswith(".sql.dump.gpg"))
                 | .LastModified]
                | sort | last // empty
              ')"; then
            if [ -n "$latest" ]; then
              latest_epoch="$(date -u -d "$latest" +%s)"
              now_epoch="$(date -u +%s)"
              if (( now_epoch - latest_epoch < interval_seconds )); then
                due=false
                echo "Backup is not due; newest object is $latest."
              fi
            fi
          else
            echo '::warning::Backup listing failed; running now rather than missing the backup window.'
          fi

          if [ "$due" = true ]; then
            bash scripts/backup.sh
          fi
          printf 'due=%s\n' "$due" >> "$GITHUB_OUTPUT"

      - name: Verify the new backup without restoring data
        if: steps.backup.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-backup.sh
